# Checks the PR title, since it becomes the squash commit on main, and
# labels the PR by the directories it touches. pull_request_target runs
# the base branch's copy of this file with a write token; it never checks
# out the PR's code, so that's safe for PRs from forks too.
name: PR

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: pr title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Conventional commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9/_.-]+\))?!?: .+'
          if [[ ! $TITLE =~ $re ]]; then
            echo "::error::PR title '$TITLE' is not a conventional commit, e.g. 'feat(zsh): add zoxide'"
            exit 1
          fi

  label:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/labeler@v7
