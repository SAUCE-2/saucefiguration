# The checks from CLAUDE.md, on Linux and on macOS, then a real install on
# the (throwaway) runner. macOS runs the script tests under Apple's
# /bin/bash 3.2: install.sh runs there before Nix exists.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The job names are the required checks in .github/settings.sh.
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bash: bash
          - os: macos-latest
            bash: /bin/bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31

      # Builds this runner's profiles and runs checks.nix: the zshrc
      # startup and plugin-order checks, nixfmt and shellcheck.
      - name: nix flake check
        run: nix flake check -L

      # The other platforms' profiles, evaluated but not built.
      - name: nix flake check (all systems)
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: nix flake check --all-systems --no-build

      # Homebrew's bash comes first on the runner's PATH, and
      # check-update.test.sh runs `bash check-update.sh` through PATH.
      - name: Put /bin/bash first on PATH
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          ln -sf /bin/bash "$RUNNER_TEMP/bin/bash"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"

      - name: Bash version
        run: |
          ${{ matrix.bash }} --version
          # The tests also call `bash` through PATH; it must be the same one.
          want=$(${{ matrix.bash }} --version | sed -n 1p)
          got=$(bash --version | sed -n 1p)
          echo "bash on PATH: $(command -v bash): $got"
          [ "$got" = "$want" ] || {
            echo "::error::bash on PATH is $got, want $want"
            exit 1
          }

      - name: install.test.sh
        if: ${{ !cancelled() }}
        run: ${{ matrix.bash }} zsh/install.test.sh

      - name: check-update.test.sh
        if: ${{ !cancelled() }}
        run: ${{ matrix.bash }} zsh/check-update.test.sh

      # The real thing, into the runner's $HOME, then a shell that must find
      # every tool. Twice: the second run must change nothing.
      - name: install.sh
        run: |
          ${{ matrix.bash }} zsh/install.sh
          out=$(${{ matrix.bash }} zsh/install.sh 2>&1)
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -E 'in the way|moving the old|authorized_keys: updated'; then
            echo "::error::second install.sh run changed files"
            exit 1
          fi

      - name: Shell finds the tools
        env:
          SAUCE_DISABLE_UPDATE_CHECK: 1
        run: |
          zsh=$HOME/.nix-profile/bin/zsh
          "$zsh" -i -c '
            for c in eza bat fd rg fzf zoxide jq yq direnv lazygit delta tmux micro gh oh-my-posh node pnpm go bootdev; do
              (( $+commands[$c] )) || { print -u2 "missing $c"; exit 1; }
            done
            [[ $(git config --get gpg.format) == ssh ]] || { print -u2 "git config not applied"; exit 1; }
            print ok
          '
