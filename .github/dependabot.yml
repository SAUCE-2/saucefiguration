# Keeps the actions in .github/workflows and the flake inputs in flake.lock
# current. Each is one weekly PR, so they don't bury the agent PRs.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope

  # nixpkgs and home-manager: every tool's version comes from here.
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
    groups:
      flake:
        patterns: ["*"]
    commit-message:
      prefix: build
      include: scope
