# tmux config. install.sh copies this to ~/.tmux.conf.

# tmux-256color is the right TERM, but Apple's ncurses lacks the terminfo
# entry and programs inside then fall back to dumb. Use it only if it exists.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal tmux-256color' \
  'set -g default-terminal screen-256color'
# Pass 24-bit colour through for the Oh My Posh prompt. ssh/config forces
# xterm-256color, so that is the outer TERM to match.
set -ga terminal-overrides ',xterm-256color:Tc'

set -g mouse on
set -g history-limit 100000
# Short wait after Esc, so vim and the zsh line editor don't lag.
set -sg escape-time 10
set -g focus-events on

# Count windows and panes from 1, to match the number row.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits and new windows open in the current pane's directory.
bind '"' split-window -v -c '#{pane_current_path}'
bind % split-window -h -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'

# prefix + r reloads this file.
bind r source-file ~/.tmux.conf \; display 'reloaded ~/.tmux.conf'
